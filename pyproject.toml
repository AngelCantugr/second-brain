[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "second-brain-mcp"
version = "0.1.0"
description = "Local-first Second Brain with hybrid retrieval and MCP interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.32",
  "qdrant-client>=1.13",
  "watchfiles>=1.0",
  "mcp>=1.13.0",
  "numpy>=1.26",
  "networkx>=3.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-benchmark>=4.0"]

[project.scripts]
second-brain = "second_brain.cli:main"
second-brain-mcp = "second_brain.mcp_server:run"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: real-backend tests requiring a live Ollama server (see integration/README.md)",
]

[tool.setuptools.packages.find]
include = ["second_brain*"]
